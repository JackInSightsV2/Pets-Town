name: Request boundary
on:
  push:
    branches: [codex/s7-request-routing]
  pull_request:
    paths:
      - 'src/codex/requests/**'
      - '.github/workflows/requests.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx --test src/codex/requests/*.test.ts
